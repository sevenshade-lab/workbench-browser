<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workbench Browser</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/preload.js"></script>
</head>
<body>
  <!--
    No user-facing text is written in this page. The attributes hold keys from strings.js, and app.js
    fills in the text for the chosen language as soon as it starts:
      data-t              the text inside the element
      data-t-title        the tooltip, which also serves as the name read by screen readers
      data-t-label        only the name read by screen readers
      data-t-placeholder  the placeholder text of an input
  -->
  <header class="tabbar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <button class="icon" id="newTab" type="button" data-t-title="newTab">+</button>
  </header>

  <div class="navbar">
    <button class="icon" id="back" type="button" data-t-title="back" disabled>←</button>
    <button class="icon" id="forward" type="button" data-t-title="forward" disabled>→</button>
    <button class="icon" id="reload" type="button">↻</button>
    <input id="url" type="text" spellcheck="false" autocomplete="off" data-t-label="address" data-t-placeholder="addressHint">
    <button class="icon" id="external" type="button" data-t-title="openExternal">↗</button>
  </div>

  <main class="stage" id="stage">
    <section class="view" id="view">
      <canvas id="screen" data-t-label="pageView"></canvas>
      <textarea id="ime" data-t-label="pageInput" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
      <div class="select-menu" id="selectMenu" hidden></div>
      <div class="start" id="start" hidden>
        <div class="start-inner">
          <section id="startSites" hidden>
            <div class="start-head"><h2 data-t="frequent"></h2></div>
            <div class="tiles" id="startTiles"></div>
          </section>
          <section id="startRecent" hidden>
            <div class="start-head">
              <h2 data-t="recent"></h2>
              <button class="text" id="startClear" type="button" data-t="clearHistory"></button>
            </div>
            <div class="recent" id="startList"></div>
          </section>
          <p class="start-hint" id="startHint" data-t="startHint" hidden></p>
        </div>
      </div>
      <div class="veil" id="veil">
        <p id="veilText"></p>
        <button class="primary" id="veilRetry" type="button" data-t="retry" hidden></button>
      </div>
      <div class="modal" id="modal" hidden>
        <form class="modal-box" id="modalForm">
          <p id="modalText"></p>
          <textarea id="modalInput" rows="2" hidden></textarea>
          <div class="modal-actions">
            <button class="text" id="modalCancel" type="button"></button>
            <button class="primary" id="modalOk" type="submit"></button>
          </div>
        </form>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </section>
  </main>

  <script src="/strings.js"></script>
  <script src="/app.js"></script>
</body>
</html>
